<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Windows 97 Desktop</title>
  <meta name="description" content="Retro Windows 97-inspired desktop landing page for the recipe site.">
  <link rel="stylesheet" href="css/index.css?v=20261010-organized">
</head>
<body class="retro-page">
  <div class="retro-shell">
    <main class="desktop-grid">
      <div class="desktop-icons" aria-label="Desktop shortcuts">
        <a class="desktop-item" href="recipes.html" aria-label="Open Recipes">
          <span class="desktop-icon file-icon" aria-hidden="true">📄</span>
          <span class="desktop-label">File Recipes</span>
        </a>

        <a class="desktop-item" href="culinary-arts.html" aria-label="Open Culinary Arts">
          <span class="desktop-icon folder-icon" aria-hidden="true">📁</span>
          <span class="desktop-label">File Culinary Arts</span>
        </a>
      </div>
    </main>

    <footer class="taskbar" aria-label="System taskbar">
      <button class="start-button" type="button" aria-label="Start">Start</button>
      <div class="taskbar-divider" aria-hidden="true"></div>
      <div class="taskbar-message">Desktop</div>
      <div class="taskbar-clock" id="desktop-clock">--:--</div>
    </footer>
  </div>

  <script src="js/index.js"></script>
</body>
</html>
